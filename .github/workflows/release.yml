name: Release

on:
  workflow_dispatch:
    inputs:
      package-path:
        description: 'Package to publish: "." for the SDK, or a path under packages/'
        required: false
        default: '.'
        type: string
  workflow_call:
    inputs:
      package-path:
        description: 'Package to publish: "." for the SDK, or a path under packages/'
        required: false
        default: '.'
        type: string
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        required: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      # Always at the repository root: it installs every workspace package.
      - name: Install Dependencies
        run: npm install

      - name: Build Project
        working-directory: ${{ inputs.package-path }}
        run: npm run build

      - name: Run Tests
        working-directory: ${{ inputs.package-path }}
        run: npm run test

      - name: Teardown Socket Firewall
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d

      - name: Publish
        working-directory: ${{ inputs.package-path }}
        run: npm publish --tag latest --access public --provenance
