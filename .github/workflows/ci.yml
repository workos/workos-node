name: CI

on:
  push:
    branches:
      - 'main'
  pull_request: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: true

      - name: Install Dependencies
        run: |
          npm install

      - name: Prettier
        run: |
          npm run prettier

      - name: Lint
        run: |
          npm run lint

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Build
        run: |
          npm run build

      - name: Test
        run: |
          npm run test

  # Each package under packages/ is released on its own, so each is built and
  # tested on its own.
  packages:
    name: ${{ matrix.package }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        package:
          - workload-identity-github-actions
          - workload-identity-gcp
          - workload-identity-aws
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: true

      # At the repository root: it installs every workspace package.
      - name: Install Dependencies
        run: |
          npm install

      - name: Prettier
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run prettier

      - name: Lint
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run lint

      - name: Typecheck
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run typecheck

      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run build

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run test
